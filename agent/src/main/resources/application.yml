server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agent

  profiles:
    # 本地开发默认加载 application-local.yml；部署时可用 SPRING_PROFILES_ACTIVE 覆盖。
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aiops_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}

  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

deepseek:
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-flash}
  connect-timeout: ${DEEPSEEK_CONNECT_TIMEOUT:5s}
  read-timeout: ${DEEPSEEK_READ_TIMEOUT:60s}
  max-tool-rounds: ${DEEPSEEK_MAX_TOOL_ROUNDS:5}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

  database:
    check-on-startup: ${DB_CHECK_ON_STARTUP:true}

  monitor:
    network-host: ${MONITOR_NETWORK_HOST:www.baidu.com}
    network-port: ${MONITOR_NETWORK_PORT:443}
    network-timeout-ms: ${MONITOR_NETWORK_TIMEOUT_MS:1000}
    service-name: ${MONITOR_SERVICE_NAME:MySQL}
    service-host: ${MONITOR_SERVICE_HOST:127.0.0.1}
    service-port: ${MONITOR_SERVICE_PORT:3306}
    service-timeout-ms: ${MONITOR_SERVICE_TIMEOUT_MS:500}

logging:
  level:
    com.aiops.agent: INFO
