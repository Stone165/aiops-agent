spring:
  datasource:
    url: jdbc:h2:mem:aiops_agent;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

deepseek:
  api-key: test-key
  max-tool-rounds: 3

app:
  monitor:
    network-host: 127.0.0.1
    network-port: 1
    network-timeout-ms: 100
    service-name: test-service
    service-host: 127.0.0.1
    service-port: 1
    service-timeout-ms: 100
